[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.*",
    "/demos",
    "/gallery",
]

[project]
name = "terminalCanvas"
version = "0.6.3"
dependencies = [
    "pillow",
    "numpy",
]
requires-python = ">= 3.11"
authors = [
    {name = "RandomMaerks", email = "rmforbusiness@gmail.com"},
]
description = "A module for creating a canvas and displaying text-based graphics in the terminal"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["terminal", "graphics", "raster", "ansi", "canvas", "windows", "console"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/RandomMaerks/terminalCanvas"
Issues = "https://github.com/RandomMaerks/terminalCanvas/issues"
